name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp last-updated date
        run: node scripts/update-last-updated.mjs

      - name: Sync Things to Do events from Google Sheets
        env:
          VITE_GOOGLE_SHEETS_API_KEY: ${{ secrets.VITE_GOOGLE_SHEETS_API_KEY }}
        run: |
          if [ -z "${VITE_GOOGLE_SHEETS_API_KEY}" ]; then
            echo "::error::VITE_GOOGLE_SHEETS_API_KEY must be set in repository secrets."
            exit 1
          fi
          npm run sync-events

      - name: Build for production
        run: npm run build

      - name: Deploy to Cloudflare Workers (production)
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set in repository secrets."
            exit 1
          fi
          npx wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
